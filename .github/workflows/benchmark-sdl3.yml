name: SDL3 benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/benchmark-sdl3.yml
      - benchmarks/sdl3/benchmark.py
      - benchmarks/sdl3/benchmark_impl.py
      - benchmarks/sdl3/benchmark_stats.py
      - benchmarks/sdl3/curve_controlled.py
      - benchmarks/sdl3/curve_report.py
      - benchmarks/sdl3/render_report.py

permissions:
  contents: write

concurrency:
  group: sdl3-benchmark-publish
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential git time

      - name: Machine
        run: |
          uname -a
          lscpu | sed -n '1,20p'
          cc --version | head -1
          cmake --version | head -1
          ninja --version

      - name: Benchmark and profile SDL3
        env:
          BENCH_JOBS: 2
        run: |
          mkdir -p benchmark-report
          set -o pipefail
          python3 benchmarks/sdl3/benchmark.py | tee benchmark-report/benchmark.log

      - name: Build benchmark report
        run: |
          python3 benchmarks/sdl3/render_report.py \
            benchmark-report/benchmark.log \
            benchmark-report

      - name: Update tracked benchmark suite
        run: |
          cp benchmark-report/timings.svg benchmarks/sdl3/timings.svg
          cp benchmark-report/resources.svg benchmarks/sdl3/resources.svg
          cp benchmark-report/results.json benchmarks/sdl3/results.json
          cp benchmark-report/summary.md benchmarks/sdl3/report.md
          rm -f benchmarks/sdl3/results-*.json
          python3 benchmarks/render_suite.py

      - name: Publish benchmark summary
        run: cat benchmark-report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdl3-benchmark-${{ github.run_number }}
          path: benchmark-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit generated benchmark
        run: |
          for attempt in 1 2 3 4 5; do
            git fetch origin main && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep $((attempt * 2))
          done
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main changed while the benchmark was running; refusing to publish stale results"
            echo "Run the workflow again from the latest main."
            exit 1
          fi

          git add -- \
            BENCHMARK.md \
            README.md \
            benchmarks/sdl3/timings.svg \
            benchmarks/sdl3/resources.svg \
            benchmarks/sdl3/results.json \
            benchmarks/sdl3/report.md
          git add -u -- benchmarks/sdl3

          if git diff --cached --quiet; then
            echo "Generated benchmark files are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update benchmark suite [skip ci]"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
