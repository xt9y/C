name: SDL3 benchmark

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sdl3-benchmark-publish
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential git time

      - name: Machine
        run: |
          uname -a
          lscpu | sed -n '1,20p'
          cc --version | head -1
          cmake --version | head -1
          ninja --version

      - name: Benchmark and profile SDL3
        env:
          BENCH_JOBS: 2
        run: |
          mkdir -p benchmark-report
          set -o pipefail
          python3 benchmarks/sdl3/benchmark.py | tee benchmark-report/benchmark.log

      - name: Build benchmark report
        run: |
          python3 benchmarks/sdl3/render_report.py \
            benchmark-report/benchmark.log \
            benchmark-report

      - name: Update tracked benchmark files
        run: |
          cp benchmark-report/timings.svg benchmarks/sdl3/timings.svg
          cp benchmark-report/resources.svg benchmarks/sdl3/resources.svg
          cp benchmark-report/results.json benchmarks/sdl3/results.json
          rm -f benchmarks/sdl3/results-*.json

          {
            echo '# SDL3 benchmark'
            echo
            echo '_Generated automatically by the manually-triggered SDL3 benchmark GitHub Actions workflow. Do not edit benchmark numbers by hand._'
            echo
            tail -n +2 benchmark-report/summary.md
            echo
            echo 'Raw measurements and every sample: [`benchmarks/sdl3/results.json`](benchmarks/sdl3/results.json)'
          } > BENCHMARK.md

          python3 - <<'PY'
          import json
          from pathlib import Path

          START = '<!-- sdl3-benchmark:start -->'
          END = '<!-- sdl3-benchmark:end -->'

          def fmt(ms):
              return f'{ms / 1000:.2f} s' if ms >= 1000 else f'{ms:.1f} ms'

          result = json.loads(Path('benchmark-report/results.json').read_text())
          c = result['c']
          ninja = result['cmake_ninja']
          change = result['change_stats']

          section = f'''{START}
          ## SDL3 benchmark

          Real SDL3 static debug build, {result['source_count']} translation units, {result['jobs']} build jobs on a {result['machine']['cpu_count']}-vCPU GitHub Actions runner.

          ![SDL3 build-time benchmark](benchmarks/sdl3/timings.svg)

          - Clean: `c` {fmt(c['clean']['wall_ms'])}; CMake + Ninja {fmt(ninja['clean']['wall_ms'])}.
          - Real {change['commits']}-commit update: `c` {fmt(c['real_update']['wall_ms'])}; CMake + Ninja {fmt(ninja['real_update']['wall_ms'])}.
          - Rebuilt TUs: {c['translation_units_rebuilt']} / {result['source_count']} with `c`; {ninja['translation_units_rebuilt']} / {result['source_count']} with Ninja.

          Full generated report and raw measurements: [BENCHMARK.md](BENCHMARK.md)
          {END}'''
          section = '\n'.join(line[10:] if line.startswith('          ') else line for line in section.splitlines())

          path = Path('README.md')
          text = path.read_text()
          if START in text and END in text:
              before, rest = text.split(START, 1)
              _, after = rest.split(END, 1)
              text = before.rstrip() + '\n\n' + section + after
          else:
              start = text.find('## SDL3 benchmark')
              if start < 0:
                  raise RuntimeError('README benchmark section not found')
              end = text.find('\n## ', start + 1)
              if end < 0:
                  end = len(text)
              text = text[:start].rstrip() + '\n\n' + section + '\n\n' + text[end:].lstrip()
          path.write_text(text)
          PY

      - name: Publish benchmark summary
        run: cat benchmark-report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdl3-benchmark-${{ github.run_number }}
          path: benchmark-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit generated benchmark
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main changed while the benchmark was running; refusing to publish stale results"
            echo "Run the workflow again from the latest main."
            exit 1
          fi

          git add -- \
            BENCHMARK.md \
            README.md \
            benchmarks/sdl3/timings.svg \
            benchmarks/sdl3/resources.svg \
            benchmarks/sdl3/results.json
          git add -u -- benchmarks/sdl3

          if git diff --cached --quiet; then
            echo "Generated benchmark files are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update SDL3 benchmark [skip ci]"
          git push origin HEAD:main
