name: SDL3 benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential git time
      - name: Machine
        run: |
          uname -a
          lscpu | sed -n '1,20p'
          cc --version | head -1
          cmake --version | head -1
          ninja --version
      - name: Benchmark and profile SDL3
        env:
          BENCH_JOBS: 2
        run: python3 benchmarks/sdl3/benchmark.py
