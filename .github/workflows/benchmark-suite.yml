name: Benchmark suite report

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - SDL3 benchmark
      - cJSON overhead benchmark
      - libcurl fan-out benchmark
      - Wireshark large-project benchmark
    types: [completed]
  push:
    branches: [main]
    paths:
      - .github/workflows/benchmark-suite.yml
      - benchmarks/render_suite.py

permissions:
  contents: write

concurrency:
  group: benchmark-suite-report
  cancel-in-progress: false

jobs:
  report:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Render combined benchmark report
        run: python3 benchmarks/render_suite.py

      - name: Verify benchmark inputs
        run: |
          test -s benchmarks/cjson/results.json
          test -s benchmarks/sdl3/results.json
          test -s benchmarks/sdl3/report.md
          test -s benchmarks/fanout/results.json
          test -s benchmarks/large/results.json
          test -s BENCHMARK.md

      - name: Publish combined report
        run: |
          for attempt in 1 2 3 4 5; do
            git fetch origin main && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep $((attempt * 2))
          done
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main changed while the report was being rendered; refusing stale publish"
            exit 1
          fi

          git add -- BENCHMARK.md README.md
          if git diff --cached --quiet; then
            echo "Combined benchmark report is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update benchmark suite report [skip ci]"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
