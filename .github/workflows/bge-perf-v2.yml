name: BGE Performance V2

on:
  push:
    branches:
      - build-performance

permissions:
  contents: read

jobs:
  bge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install BGE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev xorg-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxext-dev
      - name: Build C
        run: make
      - name: Checkout BGE
        run: git clone --depth 1 https://github.com/xt9y/BGE.git /tmp/bge
      - name: Benchmark half-core default and warm cache
        run: |
          cd /tmp/bge
          rm -rf "$HOME/.cache/c" build
          /usr/bin/time -f 'default-half-cpu cold: %e s' "$GITHUB_WORKSPACE/build/c" build --no-object-cache 2>&1 | tee /tmp/default.log
          "$GITHUB_WORKSPACE/build/c" clean
          /usr/bin/time -f 'parallel cached population: %e s' "$GITHUB_WORKSPACE/build/c" build 2>&1 | tee /tmp/populate.log
          "$GITHUB_WORKSPACE/build/c" clean
          /usr/bin/time -f 'warm global cache: %e s' "$GITHUB_WORKSPACE/build/c" build --profile 2>&1 | tee /tmp/warm.log
          grep -q 'cached' /tmp/warm.log
          grep -q 'profile \[bge\]' /tmp/warm.log
          test -x build/debug/bge
