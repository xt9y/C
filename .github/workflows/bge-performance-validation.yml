name: BGE Performance Validation

on:
  push:
    branches:
      - build-performance

permissions:
  contents: read

jobs:
  bge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout C
        uses: actions/checkout@v4

      - name: Install BGE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            xorg-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxext-dev

      - name: Build C
        run: make

      - name: Checkout BGE
        run: git clone --depth 1 https://github.com/xt9y/BGE.git /tmp/bge

      - name: Serial clean build
        run: |
          cd /tmp/bge
          /usr/bin/time -f 'serial clean build: %e s' \
            "$GITHUB_WORKSPACE/build/c" build -j1 --no-object-cache
          test -x build/debug/bge
          "$GITHUB_WORKSPACE/build/c" clean

      - name: Parallel clean build
        run: |
          cd /tmp/bge
          /usr/bin/time -f 'parallel clean build: %e s' \
            "$GITHUB_WORKSPACE/build/c" build -j4
          test -x build/debug/bge
          "$GITHUB_WORKSPACE/build/c" clean

      - name: Global cache rebuild after clean
        run: |
          cd /tmp/bge
          /usr/bin/time -f 'object-cache clean rebuild: %e s' \
            "$GITHUB_WORKSPACE/build/c" build -j4 2> /tmp/cache-build.log
          cat /tmp/cache-build.log
          test -x build/debug/bge
          grep -q 'cached' /tmp/cache-build.log
