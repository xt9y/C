name: CI repair apply

on:
  push:
    branches: [ci-repair]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci-repair
      - name: Apply repair
        run: python3 .github/ci/repair_atomic_build_script.py
      - name: Build and focused regression
        run: |
          make clean
          make
          sh .github/ci/tests/interrupted_compile.sh "$(pwd)/build/c" "$(pwd)/include"
      - name: Remove repair scaffolding
        run: rm .github/ci/repair_atomic_build_script.py .github/workflows/ci-repair-apply.yml
      - name: Commit repair branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A src/main.c .github/ci/repair_atomic_build_script.py .github/workflows/ci-repair-apply.yml
          git commit -m "Make build script cache writes atomic"
          git push origin HEAD:ci-repair
