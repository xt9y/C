name: CI repair concurrency

on:
  push:
    branches: [ci-repair]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci-repair
      - name: Cancel obsolete CI runs on new commits
        run: sed -i 's/cancel-in-progress: false/cancel-in-progress: true/' .github/workflows/ci.yml
      - name: Remove repair workflow
        run: rm .github/workflows/ci-repair-concurrency.yml
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github/workflows/ci.yml .github/workflows/ci-repair-concurrency.yml
          git commit -m "Cancel obsolete CI runs"
          git push origin HEAD:ci-repair
