name: CI repair concurrency

on:
  push:
    branches: [ci-repair]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci-repair
      - name: Harden CI configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          s = p.read_text()
          s = s.replace('cancel-in-progress: false', 'cancel-in-progress: true', 1)
          s = s.replace('''      - name: Install Clang\n        run: |\n          sudo apt-get update\n          sudo apt-get install -y clang\n''', '''      - name: Verify Clang\n        run: clang --version\n''')
          s = s.replace('''      - name: Install Clang and LLVM coverage tools\n        run: |\n          sudo apt-get update\n          sudo apt-get install -y clang llvm\n''', '''      - name: Verify Clang and LLVM coverage tools\n        run: |\n          clang --version\n          llvm-cov --version\n''')
          p.write_text(s)
          PY
      - name: Remove repair workflow
        run: rm .github/workflows/ci-repair-concurrency.yml
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github/workflows/ci.yml .github/workflows/ci-repair-concurrency.yml
          git commit -m "Harden CI scheduling and tool setup"
          git push origin HEAD:ci-repair
