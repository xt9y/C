name: CI repair explain output

on:
  push:
    branches: [ci-repair]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci-repair
      - name: Apply repair
        run: python3 .github/ci/repair_explain_output.py
      - name: Build and focused regression
        run: |
          make clean
          make
          sh .github/ci/tests/generated_source.sh "$(pwd)/build/c" "$(pwd)/include"
      - name: Clean repair state
        run: rm -f .repair-generator-result .github/ci/repair_explain_output.py .github/workflows/ci-repair-explain.yml
      - name: Commit repair branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A src/cli.c .repair-generator-result .github/ci/repair_explain_output.py .github/workflows/ci-repair-explain.yml
          git commit -m "Expose generated build explanations"
          git push origin HEAD:ci-repair
