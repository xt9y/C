name: CI repair LLVM tools

on:
  push:
    branches: [ci-repair]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ci-repair
      - name: Patch fuzz tool verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          s = p.read_text()
          old = '''      - name: Verify fuzz toolchain\n        run: |\n          clang --version\n          llvm-cov --version\n'''
          new = '''      - name: Verify fuzz toolchain\n        run: |\n          clang --version\n          cov=\"$(command -v llvm-cov || command -v llvm-cov-21 || command -v llvm-cov-20 || command -v llvm-cov-19 || command -v llvm-cov-18 || command -v llvm-cov-17 || true)\"\n          prof=\"$(command -v llvm-profdata || command -v llvm-profdata-21 || command -v llvm-profdata-20 || command -v llvm-profdata-19 || command -v llvm-profdata-18 || command -v llvm-profdata-17 || true)\"\n          test -n \"$cov\"\n          test -n \"$prof\"\n          \"$cov\" --version\n          \"$prof\" --version\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one fuzz tool verification block, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove repair workflow
        run: rm .github/workflows/ci-repair-llvm.yml
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github/workflows/ci.yml .github/workflows/ci-repair-llvm.yml
          git commit -m "Discover versioned LLVM coverage tools"
          git push origin HEAD:ci-repair
