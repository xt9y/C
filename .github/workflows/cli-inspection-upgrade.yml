name: CLI inspection upgrade (one shot)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply CLI inspection patch
        run: python3 .github/ci/cli_inspection_upgrade.py
      - name: Build and test CLI inspection
        run: |
          make clean
          make
          sh .github/ci/tests/cli_inspection.sh "$(pwd)/build/c" "$(pwd)/include"
      - name: Remove one-shot migration files
        run: rm .github/ci/cli_inspection_upgrade.py .github/workflows/cli-inspection-upgrade.yml
      - name: Commit CLI inspection support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.c .github/ci/cli_inspection_upgrade.py .github/workflows/cli-inspection-upgrade.yml
          git commit -m "Add dependency tree and cache stats commands"
          git push origin HEAD:main
