name: Core upgrade (one shot)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply core patch
        run: python3 .github/ci/core_upgrade.py
      - name: Validate build and tests
        run: |
          make clean
          make
          make test
      - name: Remove one-shot migration files
        run: rm .github/ci/core_upgrade.py .github/workflows/core-upgrade.yml
      - name: Commit upgraded core to main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/cli.c .github/ci/core_upgrade.py .github/workflows/core-upgrade.yml
          git commit -m "Complete target graph and cache hardening"
          git push origin HEAD:main
