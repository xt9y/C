name: Feature validation (one shot)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Validate new feature regressions
        shell: bash
        run: |
          set +e
          sh .github/ci/tests/target_graph.sh "$(pwd)/build/c" "$(pwd)/include" > /tmp/target.log 2>&1
          target_rc=$?
          sh .github/ci/tests/generated_source.sh "$(pwd)/build/c" "$(pwd)/include" > /tmp/generated.log 2>&1
          generated_rc=$?
          {
            echo "target_graph_rc=$target_rc"
            echo "generated_source_rc=$generated_rc"
            echo "--- target graph ---"
            cat /tmp/target.log
            echo "--- generated source ---"
            cat /tmp/generated.log
          } > .feature-validation-result
          exit 0
      - name: Publish validation result and remove workflow
        run: |
          rm .github/workflows/feature-validation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .feature-validation-result .github/workflows/feature-validation.yml
          git commit -m "Record feature validation result"
          git push origin HEAD:main
