name: Fix Performance V2 Integration

on:
  push:
    branches:
      - build-performance

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair generated C literals
        run: python3 tools/fix_perf_v2.py
      - name: Build and test
        run: |
          make clean
          make
          make test
          ./build/c doctor
          ./build/c --help | grep -q 'half available CPUs'
      - name: Remove one-shot repair machinery
        run: git rm -f .github/workflows/fix-perf-v2.yml tools/fix_perf_v2.py
      - name: Commit repair
        run: |
          git config user.name "Felix"
          git config user.email "felix@xt9y.de"
          git add src/cli.c
          git commit -m "Fix advanced performance integration literals"
          git push origin HEAD:build-performance
