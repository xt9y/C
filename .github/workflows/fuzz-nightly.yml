name: Fuzz nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [lockfile, depfile, cache, fs, project]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Build fuzz target with ASan + UBSan + LSan
        env:
          CC: clang
        run: ./fuzz/build.sh "${{ matrix.target }}"

      - name: Fuzz for 10 minutes
        run: ./fuzz/run-one.sh "${{ matrix.target }}" 600

      - name: Upload crash reproducer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}-crash-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
