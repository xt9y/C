name: Generated source upgrade (one shot)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply generated-source patch
        run: python3 .github/ci/generated_upgrade.py
      - name: Validate build and tests
        run: |
          make clean
          make
          make test
      - name: Remove one-shot migration files
        run: rm .github/ci/generated_upgrade.py .github/workflows/generated-upgrade.yml
      - name: Commit generated-source support to main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add include/cbuild.h src/main.c src/cli.c .github/ci/generated_upgrade.py .github/workflows/generated-upgrade.yml
          git commit -m "Add generated source support"
          git push origin HEAD:main
