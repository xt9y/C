name: Generator hash hardening (one shot)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply generator hashing patch
        run: python3 .github/ci/generator_hash_upgrade.py
      - name: Build
        run: make clean && make
      - name: Validate generated sources and target graph
        run: |
          sh .github/ci/tests/generated_source.sh "$(pwd)/build/c" "$(pwd)/include"
          sh .github/ci/tests/target_graph.sh "$(pwd)/build/c" "$(pwd)/include"
      - name: Run regression suite
        run: make test
      - name: Remove temporary validation evidence and migration files
        run: |
          rm -f .feature-validation-result
          rm .github/ci/generator_hash_upgrade.py .github/workflows/generator-hash-upgrade.yml
      - name: Commit hardening to main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/cli.c .feature-validation-result .github/ci/generator_hash_upgrade.py .github/workflows/generator-hash-upgrade.yml
          git commit -m "Harden generated source invalidation"
          git push origin HEAD:main
