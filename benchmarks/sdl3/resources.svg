<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img" aria-labelledby="title desc">
<title id="title">SDL3 real-update resources</title>
<desc id="desc">Resource usage for the same 4-TU incremental rebuild.</desc>
<style>
      .bg{fill:#ffffff}.text{fill:#1f2328}.muted{fill:#656d76}.track{fill:#f6f8fa}
      .cbar{fill:#0969da}.nbar{fill:#8c959f}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .title{font-size:24px;font-weight:700}.subtitle{font-size:14px}.label{font-size:15px;font-weight:600}
      .small{font-size:13px}.value{font-size:13px;font-weight:600}
      @media (prefers-color-scheme: dark){
        .bg{fill:#0d1117}.text{fill:#e6edf3}.muted{fill:#8b949e}.track{fill:#21262d}
        .cbar{fill:#2f81f7}.nbar{fill:#6e7681}
      }
    </style>
<rect class="bg" width="100%" height="100%" rx="12"/>
<text x="34" y="42" class="title text">SDL3 real-update resources</text>
<text x="34" y="68" class="subtitle muted">Resource usage for the same 4-TU incremental rebuild.</text>
<rect x="720" y="30" width="15" height="15" rx="3" class="cbar"/><text x="743" y="42" class="small text">c</text>
<rect x="782" y="30" width="15" height="15" rx="3" class="nbar"/><text x="805" y="42" class="small text">CMake + Ninja</text>
<text x="34" y="130" class="label text">Update CPU time</text>
<text x="34" y="162" class="small muted">c</text>
<rect x="255" y="142" width="590" height="24" rx="6" class="track"/>
<rect x="255" y="142" width="542.24" height="24" rx="6" class="cbar"/>
<text x="859" y="159" class="value text">1.93 s</text>
<text x="34" y="196" class="small muted">CMake + Ninja</text>
<rect x="255" y="176" width="590" height="24" rx="6" class="track"/>
<rect x="255" y="176" width="590.00" height="24" rx="6" class="nbar"/>
<text x="859" y="193" class="value text">2.10 s</text>
<text x="34" y="252" class="label text">Update peak RSS</text>
<text x="34" y="284" class="small muted">c</text>
<rect x="255" y="264" width="590" height="24" rx="6" class="track"/>
<rect x="255" y="264" width="590.00" height="24" rx="6" class="cbar"/>
<text x="859" y="281" class="value text">141.02 MiB</text>
<text x="34" y="318" class="small muted">CMake + Ninja</text>
<rect x="255" y="298" width="590" height="24" rx="6" class="track"/>
<rect x="255" y="298" width="586.37" height="24" rx="6" class="nbar"/>
<text x="859" y="315" class="value text">140.15 MiB</text>
<text x="34" y="374" class="label text">Filesystem outputs</text>
<text x="34" y="406" class="small muted">c</text>
<rect x="255" y="386" width="590" height="24" rx="6" class="track"/>
<rect x="255" y="386" width="309.55" height="24" rx="6" class="cbar"/>
<text x="859" y="403" class="value text">66,704</text>
<text x="34" y="440" class="small muted">CMake + Ninja</text>
<rect x="255" y="420" width="590" height="24" rx="6" class="track"/>
<rect x="255" y="420" width="590.00" height="24" rx="6" class="nbar"/>
<text x="859" y="437" class="value text">127,136</text>
<text x="34" y="496" class="label text">Context switches</text>
<text x="34" y="528" class="small muted">c</text>
<rect x="255" y="508" width="590" height="24" rx="6" class="track"/>
<rect x="255" y="508" width="413.00" height="24" rx="6" class="cbar"/>
<text x="859" y="525" class="value text">77</text>
<text x="34" y="562" class="small muted">CMake + Ninja</text>
<rect x="255" y="542" width="590" height="24" rx="6" class="track"/>
<rect x="255" y="542" width="590.00" height="24" rx="6" class="nbar"/>
<text x="859" y="559" class="value text">110</text>
<text x="34" y="644" class="small muted">Each metric pair has its own scale. Lower is better.</text>
</svg>
